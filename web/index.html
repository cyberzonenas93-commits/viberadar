<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VibeRadar is a DJ intelligence workstation for trend discovery, set building, local library prep, and DJ exports.">
  <meta name="theme-color" content="#06070B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeRadar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VibeRadar - DJ Intelligence Workstation</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #06070b;
      color: #f3f6fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #loading-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, rgba(6, 7, 11, 0.94), rgba(6, 7, 11, 0.62), rgba(6, 7, 11, 0.9)),
        url("assets/viberadar-hero.jpg") center / cover no-repeat;
      overflow: hidden;
    }

    #loading-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(43, 57, 78, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(43, 57, 78, 0.14) 1px, transparent 1px);
      background-size: 58px 58px;
      opacity: 0.65;
    }

    .loader {
      position: relative;
      z-index: 1;
      width: min(420px, calc(100% - 40px));
      display: grid;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #24c8db, #8b5cf6, #e84a7d, #f7c948);
      box-shadow: 0 18px 42px rgba(36, 200, 219, 0.24);
    }

    .brand strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: #a7b2c8;
      font-size: 13px;
      font-weight: 650;
    }

    .bar {
      position: relative;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(43, 57, 78, 0.8);
    }

    .bar::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #24c8db, #5ee89e, #f7c948);
      animation: load 1.2s ease-in-out infinite;
    }

    @keyframes load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="loading-shell" aria-label="Loading VibeRadar">
    <div class="loader">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
            <circle cx="12" cy="12" r="8" stroke="white" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" fill="white"/>
            <path d="M12 4v3M20 12h-3M12 20v-3M4 12h3" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <strong>VibeRadar</strong>
          <span>Preparing your DJ intelligence workspace</span>
        </div>
      </div>
      <div class="bar"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('loading-shell');
      if (shell) shell.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
