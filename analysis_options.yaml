# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # romantic-taussig is a separate project with its own setup.
    - romantic-taussig/**
    # Generated files and build artefacts.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
  language:
    # Reject raw generic types like `List` without a type parameter.
    strict-raw-types: true
    # NOTE: `strict-casts: true` is intentionally disabled for now — the JSON
    # decoding in artist services returns `dynamic` maps; enabling it would
    # require typed DTOs for Spotify/Apple Music/YouTube responses. Re-enable
    # once those paths are properly typed.

linter:
  rules:
    # Async safety — highest-value lints for a Flutter app.
    cancel_subscriptions: true
    close_sinks: true
    avoid_slow_async_io: true
    unawaited_futures: true
    # Correctness
    avoid_empty_else: true
    avoid_returning_null_for_future: true
