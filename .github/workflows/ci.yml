name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # Keep --fatal-warnings OFF; project has pre-existing warnings that
        # are being worked through. Instead we grep for errors and fail on
        # those only.
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.out
          if grep -E "^\s*error •" analyze.out > /dev/null; then
            echo "::error::flutter analyze reported errors"
            exit 1
          fi

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Build Flutter Web
        run: flutter build web --release --no-wasm-dry-run

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Test Functions
        run: npm --prefix functions test

      - name: Audit Functions dependencies
        run: npm --prefix functions audit --audit-level=moderate
