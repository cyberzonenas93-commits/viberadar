appId: com.viberadar.viberadar
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Spot the wave early\nVibeRadar scans the world's charts so you play tomorrow's hits tonight."
    timeout: 30000
- assertVisible: "Skip"
- assertVisible: "Next"
- takeScreenshot: ios-intro-carousel
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Track Global Trends\nMonitor momentum across Spotify, YouTube, Apple Music, and more. See which tracks are breaking out before they peak."
    timeout: 15000
- assertVisible: "Skip"
- assertVisible: "Next"
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Continue with Google"
    timeout: 20000
- takeScreenshot: ios-auth-options
- assertVisible: "VibeRadar"
- assertVisible: "DJ Trend Intelligence Platform"
- assertVisible: "Continue with Google"
- assertVisible: "Sign in with Apple"
- assertVisible: "Sign in with Email"
- assertVisible: "Privacy Policy"
- tapOn: "Sign in with Email"
- extendedWaitUntil:
    visible: "Email address"
    timeout: 10000
- assertVisible: "Password"
- assertVisible: "Sign In"
- takeScreenshot: ios-email-auth-form
